name: Pipeline

# Least privilege: this pipeline only reads the repository. Auto-formatting
# on `main` (which needs write access) lives in a separate, minimal workflow:
# .github/workflows/autofmt.yml
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─────────────────────────────────────────────
  # JOB: FORMAT, LINT, TEST & DOCKER SMOKE TEST
  # ─────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Never leave the GITHUB_TOKEN behind in .git/config.
          persist-credentials: false

      - name: Set up Rust
        # `dtolnay/rust-toolchain` deliberately uses the ref (here `stable`) as
        # the toolchain selector, so this one is intentionally not SHA-pinned.
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Split restore/save on purpose: the plain `actions/cache` action also
      # saves in its post step on EVERY run (including pull requests).
      # `cache/restore` never writes, and the explicit `cache/save` further down
      # is gated to the default branch -- so an untrusted fork can read the
      # trusted cache but can never populate it (no cache poisoning of `main`).
      - name: Restore cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        # Enforced here for every run; auto-fixing is delegated to the
        # write-scoped Auto-format workflow (see .github/workflows/autofmt.yml).
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --verbose

      - name: Run doc tests
        run: cargo test --doc

      # --- fast check docker with GHA-cache ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: link_monitor:ci-test
          cache-from: type=gha
          # Only the default branch may populate the shared BuildKit cache, so
          # pull requests cannot poison it (they still get a read via cache-from).
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}

      - name: Verify container startup and dependency compatibility
        run: |
          # run container for 10 seconds, if it runs normally and bash returns code 124 use --init.
          # timeout 10 docker run --init --rm link_monitor:ci-test || [ $? -eq 124 ]

          # send SIGINT (same Ctrl+C) to container after 10 seconds, and check if it exits gracefully.
          timeout -s SIGINT 10 docker run --rm link_monitor:ci-test || [ $? -eq 124 ]

      # --- Cache: save only on main, and only on a cache miss ---
      - name: Save cargo cache
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}